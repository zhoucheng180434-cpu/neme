<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照片播放器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1 {
            color: #fff;
            margin-bottom: 20px;
            font-weight: 400;
        }

        /* 主播放器容器 */
        .player-container {
            width: 100%;
            max-width: 900px;
            background: #16213e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        /* 大图显示区 */
        .main-view {
            position: relative;
            width: 100%;
            height: 500px;
            background: #000;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .slide.active {
            opacity: 1;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 左右切换按钮 */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: rgba(0,0,0,0.4);
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.3s;
            z-index: 10;
        }

        .nav-btn:hover {
            background: rgba(0,0,0,0.7);
        }

        .prev { left: 20px; }
        .next { right: 20px; }

        /* 播放控制栏 */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 15px;
            background: #0f3460;
        }

        .ctrl-btn {
            padding: 8px 20px;
            border: none;
            background: #e94560;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .ctrl-btn:hover {
            background: #ff6b81;
        }

        .counter {
            color: #fff;
            font-size: 14px;
        }

        /* 缩略图栏 */
        .thumbnails {
            display: flex;
            gap: 8px;
            padding: 15px;
            overflow-x: auto;
            background: #16213e;
        }

        .thumb {
            flex-shrink: 0;
            width: 80px;
            height: 60px;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.3s, transform 0.3s;
            border: 2px solid transparent;
        }

        .thumb:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        .thumb.active {
            opacity: 1;
            border-color: #e94560;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 滚动条美化 */
        .thumbnails::-webkit-scrollbar {
            height: 6px;
        }
        .thumbnails::-webkit-scrollbar-thumb {
            background: #e94560;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <h1>📷 照片播放器</h1>

    <div class="player-container">
        <!-- 大图显示 -->
        <div class="main-view" id="mainView">
            <div class="slide active">
                <img src="https://picsum.photos/id/10/900/500" alt="照片1">
            </div>
            <div class="slide">
                <img src="https://picsum.photos/id/20/900/500" alt="照片2">
            </div>
            <div class="slide">
                <img src="https://picsum.photos/id/30/900/500" alt="照片3">
            </div>
            <div class="slide">
                <img src="https://picsum.photos/id/40/900/500" alt="照片4">
            </div>
            <div class="slide">
                <img src="https://picsum.photos/id/50/900/500" alt="照片5">
            </div>

            <button class="nav-btn prev" onclick="prevSlide()">‹</button>
            <button class="nav-btn next" onclick="nextSlide()">›</button>
        </div>

        <!-- 控制栏 -->
        <div class="controls">
            <button class="ctrl-btn" id="playBtn" onclick="togglePlay()">▶ 播放</button>
            <span class="counter" id="counter">1 / 5</span>
        </div>

        <!-- 缩略图 -->
        <div class="thumbnails" id="thumbnails">
            <!-- JS动态生成 -->
        </div>
    </div>

    <script>
        const slides = document.querySelectorAll('.slide');
        const thumbnails = document.getElementById('thumbnails');
        const counter = document.getElementById('counter');
        const playBtn = document.getElementById('playBtn');
        
        let currentIndex = 0;
        let timer = null;
        let isPlaying = false;
        const total = slides.length;

        // 生成缩略图
        slides.forEach((slide, index) => {
            const imgSrc = slide.querySelector('img').src;
            const thumb = document.createElement('div');
            thumb.className = 'thumb' + (index === 0 ? ' active' : '');
            thumb.innerHTML = `<img src="${imgSrc}" alt="缩略图${index+1}">`;
            thumb.onclick = () => goToSlide(index);
            thumbnails.appendChild(thumb);
        });

        const thumbs = document.querySelectorAll('.thumb');

        // 切换到指定图片
        function goToSlide(index) {
            slides[currentIndex].classList.remove('active');
            thumbs[currentIndex].classList.remove('active');
            
            currentIndex = index;
            
            slides[currentIndex].classList.add('active');
            thumbs[currentIndex].classList.add('active');
            counter.textContent = `${currentIndex + 1} / ${total}`;
        }

        // 下一张
        function nextSlide() {
            let next = (currentIndex + 1) % total;
            goToSlide(next);
        }

        // 上一张
        function prevSlide() {
            let prev = (currentIndex - 1 + total) % total;
            goToSlide(prev);
        }

        // 播放/暂停
        function togglePlay() {
            if (isPlaying) {
                clearInterval(timer);
                playBtn.textContent = '▶ 播放';
                isPlaying = false;
            } else {
                timer = setInterval(nextSlide, 3000); // 3秒切换一张
                playBtn.textContent = '⏸ 暂停';
                isPlaying = true;
            }
        }

        // 键盘左右键控制
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevSlide();
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === ' ') {
                e.preventDefault();
                togglePlay();
            }
        });
    </script>
</body>
</html>
